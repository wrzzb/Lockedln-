<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LockedIn- Study Room</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="user-brand">
                <div class="avatar-circle"></div>
                <div id="user-profile" style="display: none;">
                    <span id="user-name"></span>
                    <button id="logout-btn" class="btn-danger-xs">Logout</button>
                </div>
                <button id="login-btn" class="btn-primary-xs">Login</button>
            </div>
            <nav class="side-nav">
                <a href="#" class="active" id="menu-study"><i class="fas fa-book-open"></i> Study Room</a>
                <a href="#"><i class="fas fa-calendar-alt"></i> Schedule</a>
                <a href="#" id="menu-notes"><i class="fas fa-sticky-note"></i> Notes</a>
                <label for="bg-upload" class="side-link"><i class="fas fa-image"></i> Ganti Latar</label>
                <input type="file" id="bg-upload" hidden>
            </nav>
        </aside>

        <main class="study-center">
            <header class="study-header">
                <div class="subject-info">
                    <h2>Study Room</h2>
                    
                </div>
                <div class="header-actions">
                    <label for="file-upload" class="btn-upload-header">
                        <i class="fas fa-plus"></i> Add Material
                    </label>
                    <input type="file" id="file-upload" accept=".pdf,image/*" hidden>
                    <button class="btn-session" id="start-session-btn">Start Session</button>
                </div>
            </header>

            <div class="main-viewer-panel">
                <div id="viewer-placeholder" class="upload-placeholder">
                    <i class="fas fa-file-alt" style="font-size: 4rem; color: #ccc; margin-bottom: 20px;"></i>
                    <p>Pilih materi dari rak untuk ditampilkan</p>
                </div>
                <iframe id="modal-viewer" src="" style="display:none;"></iframe>
            </div>
        </main>

        <aside class="right-panel">
            <section class="glass-panel timer-box">
                <div class="panel-label">Timer</div>
                <div class="timer-row">
                    <h1 id="time-display">25:00</h1>
                    <div class="timer-tools">
                        <input type="number" id="custom-minutes" placeholder="Min">
                        <i class="fas fa-check-circle" id="set-custom-btn" title="Set Waktu"></i>
                        <i class="fas fa-play-circle" id="start-btn" title="Mulai"></i>
                        <i class="fas fa-pause-circle" id="pause-btn" title="Jeda"></i>
                        <i class="fas fa-redo-alt" id="reset-btn" title="Reset"></i>
                    </div>
                </div>
                <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" loop></audio>
            </section>

            <section class="glass-panel bookshelf-box">
                <div class="panel-label">Materi Rak</div>
                <div class="bookshelf-grid" id="bookshelf"></div>
            </section>

            <section class="glass-panel music-box">
                <div class="panel-label">Music Player</div>
                <div class="spotify-container">
                    <iframe id="spotify-iframe" src="" width="100%" height="80" frameBorder="0" allow="autoplay; encrypted-media"></iframe>
                </div>
                <div class="playlist-config-mini">
                    <input type="text" id="playlist-url" placeholder="Paste Spotify Link...">
                    <button id="update-playlist-btn" class="btn-primary-xs">Update</button>
                </div>
                <audio id="bg-audio"></audio>
            </section>
        </aside>

        <div id="notes-page" style="display: none; width: 100%; height: 100%; color: #333; padding: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 12px; backdrop-filter: blur(10px);">
    <h3 style="color: #fff; margin-top: 0; margin-bottom: 20px; font-size: 1.5rem; font-weight: 600;">My Personal Notes</h3>
    
    <div class="notes-wrapper" style="display: flex; gap: 20px; height: calc(100% - 50px);">
        <div class="notes-input-box" style="flex: 1; display: flex; flex-direction: column; gap: 12px;">
            <input type="text" id="note-title" placeholder="Judul Catatan..." 
                   style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; outline: none;" />
            
            <textarea id="note-content" placeholder="Tulis sesuatu di sini..." rows="10" 
                      style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; resize: none; outline: none; flex-grow: 1;"></textarea>
            
            <button id="btn-save-note" 
                    style="width: 100%; padding: 12px; background-color: #00b4d8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s;">
                Simpan Catatan
            </button>
        </div>

        <div id="notes-list-container" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; max-height: 400px; padding-right: 5px;">
            </div>
    </div>
</div>

    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
